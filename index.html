<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ЭНЕРГОРЕСУРС — аренда дизельных генераторов 30–500 кВт в Самаре</title>
<meta name="description" content="Аренда дизельных генераторов 30–500 кВт в Самаре и области: подача от 2 часов, без залога, сервис 24/7, подменный фонд. Работаем по договору, безнал с НДС.">
<meta property="og:title" content="ЭНЕРГОРЕСУРС — аренда генераторов в Самаре">
<meta property="og:description" content="Подача от 2 часов, без залога, сервис 24/7. Привезём, подключим и запустим под нагрузкой.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23ff5500'%3E%3Cpath d='M13 3L4 14h6l-1 7 9-11h-6z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:#000;color:#fff}
a{color:#ff8a2a;text-decoration:none}
a:hover{color:#ffb066}
::selection{background:#ff5500;color:#fff}
#er-root ::-webkit-scrollbar{height:8px;width:8px}
#er-root ::-webkit-scrollbar-thumb{background:#2c2c33;border-radius:8px}
@keyframes erpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
@keyframes erfloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px)}}
@keyframes erglow{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.08)}}
@keyframes ermarquee{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
@keyframes erbob{0%,100%{transform:translateY(0)}50%{transform:translateY(7px)}}
@keyframes erlive{0%{box-shadow:0 0 0 0 rgba(61,214,140,.55)}70%{box-shadow:0 0 0 14px rgba(61,214,140,0)}100%{box-shadow:0 0 0 0 rgba(61,214,140,0)}}
@keyframes erlivedot{0%,100%{opacity:1}50%{opacity:.3}}
</style>
<style id="er-hover-css"></style>
</head>
<body>
<div id="er-app"></div>
<script type="text/html" id="er-template">
<div id="er-root" style="--org1:#ff8420;--org2:#ff5500;--org:#ff7b1a;--red:#ff4a4a;--panel:#0b0b0e;--panel2:#131318;--line:#26262e;--mut:#9a9aa3;background:#000;color:#fff;font-family:Montserrat,Arial,sans-serif;line-height:1.5;overflow-x:hidden;position:relative">

  <div id="er-progress" style="position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--org1),var(--org2));z-index:80;box-shadow:0 0 12px rgba(255,90,0,.6)"></div>

  <!-- HEADER -->
  <header id="er-head" style="position:sticky;top:0;z-index:60;background:rgba(0,0,0,.8);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);transition:box-shadow .3s,background .3s">
    <div style="max-width:1200px;margin:0 auto;padding:13px 24px;display:flex;align-items:center;gap:22px;flex-wrap:wrap">
      <a href="#top" style="display:flex;align-items:center;gap:10px;flex:none">
        <img src="https://static.tildacdn.com/tild3364-3166-4238-b839-643339323133/er-logo-main160i_1_1.png" alt="ЭНЕРГОРЕСУРС" style="height:34px;width:auto;display:block">
      </a>
      <div style="display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mut);border-left:1px solid var(--line);padding-left:18px">
        <svg viewBox="0 0 24 24" fill="#ffc65c" style="width:15px;height:15px"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.2l1-5.8L3.5 9.2l5.9-.9z"/></svg>
        <span style="color:#ffd27a;font-weight:800;font-size:15px">5.0</span>
        <span>на Яндексе</span>
      </div>
      <nav style="display:flex;gap:22px;margin-left:auto;font-size:14px;font-weight:500;flex-wrap:wrap">
        <a href="#about" style="color:#cfcfd6" style-hover="color:#fff">О компании</a>
        <a href="#catalog" style="color:#cfcfd6" style-hover="color:#fff">Каталог</a>
        <a href="#rent" style="color:#cfcfd6" style-hover="color:#fff">Аренда</a>
        <a href="#guarantees" style="color:#cfcfd6" style-hover="color:#fff">Гарантии</a>
        <a href="#cases" style="color:#cfcfd6" style-hover="color:#fff">Кейсы</a>
        <a href="#reviews" style="color:#cfcfd6" style-hover="color:#fff">Отзывы</a>
        <a href="#contacts" style="color:#cfcfd6" style-hover="color:#fff">Контакты</a>
      </nav>
      <div style="display:flex;align-items:center;gap:22px;flex:none">
        <a href="mailto:info@energy-res.ru" style="display:flex;align-items:center;gap:8px;color:#cfcfd6;font-size:14px;font-weight:600;line-height:1.1" style-hover="color:#fff">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--org1)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;flex:none"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
          info@energy-res.ru
        </a>
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px">
          <a href="tel:+79376530830" style="display:flex;align-items:center;gap:8px;color:#fff;line-height:1.1">
            <svg viewBox="0 0 24 24" fill="none" stroke="var(--org1)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px;flex:none"><path d="M4 5c0 8.3 6.7 15 15 15a2 2 0 0 0 2-2v-2.3a1 1 0 0 0-.8-1l-3.3-.7a1 1 0 0 0-1 .3l-1 1.2A12 12 0 0 1 9.2 9.1l1.2-1a1 1 0 0 0 .3-1L10 3.8a1 1 0 0 0-1-.8H6a2 2 0 0 0-2 2z"/></svg>
            <span style="text-align:center"><span style="font-weight:800;font-size:18px">+7 937 653-08-30</span><br><span style="font-size:11px;color:var(--mut);font-weight:500">Пн–Пт 8:00–17:00 МСК</span></span>
          </a>
          <sc-if value="{{ isOpen }}" hint-placeholder-val="{{ true }}">
            <span style="display:inline-flex;align-items:center;gap:7px;background:linear-gradient(0deg,#2fb972,#3DD68C);color:#06210f;font-weight:800;font-size:12px;padding:6px 13px;border-radius:100px;animation:erlive 2s ease-out infinite"><span style="width:8px;height:8px;border-radius:50%;background:#06210f;animation:erlivedot 1.1s ease-in-out infinite"></span>Звоните! Сейчас работаем!</span>
          </sc-if>
          <sc-if value="{{ isClosed }}" hint-placeholder-val="{{ false }}">
            <span style="display:inline-flex;align-items:center;justify-content:center;height:18px"><span style="width:10px;height:10px;border-radius:50%;background:var(--org1);animation:erlivedot 1.2s ease-in-out infinite"></span></span>
          </sc-if>
          <button onClick="{{ scrollToQuiz }}" style="width:100%;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:linear-gradient(0deg,var(--org1),var(--org2));color:#fff;font-weight:700;font-size:14px;padding:11px 20px;border:none;border-radius:10px;cursor:pointer;font-family:inherit;box-shadow:0 8px 22px rgba(255,90,0,.35);transition:transform .15s,box-shadow .15s" style-hover="transform:translateY(-2px);box-shadow:0 12px 30px rgba(255,90,0,.5)">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:17px;height:17px"><rect x="5" y="3" width="14" height="18" rx="2.2"/><path d="M8 7h8M8 11h8M12 11v7M16 11v7M8 15h8M8 18.5h8"/></svg>
            Рассчитать
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- HERO -->
  <section id="top" style="position:relative;overflow:hidden;border-bottom:1px solid var(--line)">
    <div style="position:absolute;inset:0;background:linear-gradient(90deg,#000 45%,rgba(0,0,0,.2) 100%);z-index:1;pointer-events:none"></div>
    <div style="position:absolute;top:-180px;right:-120px;width:720px;height:720px;background:radial-gradient(circle,rgba(255,90,0,.3),transparent 62%);z-index:0;pointer-events:none;animation:erglow 8s ease-in-out infinite"></div>
    <div style="position:absolute;inset:0;background:linear-gradient(90deg,#000 32%,rgba(0,0,0,.35) 100%);z-index:1;pointer-events:none"></div>
    <div style="position:relative;z-index:2;max-width:1200px;margin:0 auto;padding:clamp(38px,5.5vw,80px) 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:44px;align-items:center">

      <div>
        <div style="display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(255,132,32,.4);background:rgba(255,90,0,.08);border-radius:100px;padding:7px 15px;font-size:12.5px;font-weight:600;letter-spacing:.02em;color:#ffb066;margin-bottom:22px">
          <span style="width:8px;height:8px;border-radius:50%;background:var(--org1);animation:erpulse 1.8s ease-in-out infinite"></span>
          Самара и область · подача от 2 часов
        </div>
        <h1 style="font-size:clamp(30px,4.4vw,52px);font-weight:900;line-height:1.06;letter-spacing:-.02em;margin:0 0 20px;text-transform:uppercase">
          Аренда генераторов 30–500 кВт в Самаре — <span style="color:transparent;background:linear-gradient(0deg,var(--org1),var(--org2));-webkit-background-clip:text;background-clip:text">подача от 2 часов, без залога</span>
        </h1>
        <img src="assets/hero-gen2.png" alt="Дизельный генератор в кожухе 30 кВт" style="float:right;width:min(250px,42%);height:auto;margin:-6px -6px 8px 20px;filter:drop-shadow(0 24px 44px rgba(0,0,0,.6))">
        <p style="font-size:clamp(16px,1.5vw,18px);color:#c5c5cc;max-width:560px;margin:0 0 28px">Привезём, подключим и запустим под нагрузкой. Откажет станция — заменим за свой счёт. Вы занимаетесь работой, а не поиском электричества.</p>

        <div style="display:grid;gap:14px;max-width:560px">
          <div style="display:flex;gap:14px;align-items:flex-start">
            <span style="flex:none;width:46px;height:46px;border-radius:12px;background:rgba(255,90,0,.1);border:1px solid rgba(255,132,32,.35);display:flex;align-items:center;justify-content:center;color:var(--org1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px"><path d="M12 3l7 3v5c0 4.5-3 7.6-7 9-4-1.4-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg></span>
            <div><b style="font-size:15.5px">Работаем в белую</b><div style="color:var(--mut);font-size:13.5px">Договор, закрывающие, безнал с НДС. Без залога и предоплаты за технику.</div></div>
          </div>
          <div style="display:flex;gap:14px;align-items:flex-start">
            <span style="flex:none;width:46px;height:46px;border-radius:12px;background:rgba(255,90,0,.1);border:1px solid rgba(255,132,32,.35);display:flex;align-items:center;justify-content:center;color:var(--org1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px"><path d="M3 7h11v8H3z"/><path d="M14 10h4l3 3v2h-7z"/><circle cx="7" cy="17.5" r="1.6"/><circle cx="17.5" cy="17.5" r="1.6"/></svg></span>
            <div><b style="font-size:15.5px">Подадим, пока другие ищут</b><div style="color:var(--mut);font-size:13.5px">Отгрузка от 2 часов. Объект не встанет из-за ожидания техники.</div></div>
          </div>
          <div style="display:flex;gap:14px;align-items:flex-start">
            <span style="flex:none;width:46px;height:46px;border-radius:12px;background:rgba(255,90,0,.1);border:1px solid rgba(255,132,32,.35);display:flex;align-items:center;justify-content:center;color:var(--org1)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:24px;height:24px"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.2 5.2l2.1 2.1M16.7 16.7l2.1 2.1M18.8 5.2l-2.1 2.1M7.3 16.7l-2.1 2.1"/></svg></span>
            <div><b style="font-size:15.5px">Ломается — это наша забота</b><div style="color:var(--mut);font-size:13.5px">Сервис 24/7 в цене. Откажет станция — привезём замену за свой счёт.</div></div>
          </div>
        </div>

        <div style="display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-top:26px;padding-top:22px;border-top:1px solid var(--line)">
          <div style="display:flex;align-items:center;gap:4px">
            <svg viewBox="0 0 24 24" fill="#ffc65c" style="width:16px;height:16px"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.2l1-5.8L3.5 9.2l5.9-.9z"/></svg>
            <svg viewBox="0 0 24 24" fill="#ffc65c" style="width:16px;height:16px"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.2l1-5.8L3.5 9.2l5.9-.9z"/></svg>
            <svg viewBox="0 0 24 24" fill="#ffc65c" style="width:16px;height:16px"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.2l1-5.8L3.5 9.2l5.9-.9z"/></svg>
            <svg viewBox="0 0 24 24" fill="#ffc65c" style="width:16px;height:16px"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.2l1-5.8L3.5 9.2l5.9-.9z"/></svg>
            <svg viewBox="0 0 24 24" fill="#ffc65c" style="width:16px;height:16px"><path d="M12 3l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9 6.8 19.2l1-5.8L3.5 9.2l5.9-.9z"/></svg>
            <span style="font-size:13px;color:#cfcfd6;margin-left:5px"><b style="color:#fff">5.0</b> · отзывы на Яндексе</span>
          </div>
          <div style="font-size:13px;color:#cfcfd6"><b style="color:#fff">18 лет</b> на рынке энергетики</div>
        </div>
      </div>

      <!-- QUIZ CARD -->
      <div id="quiz-card" style="background:linear-gradient(180deg,#16161c,#0d0d11);border:1px solid rgba(255,132,32,.45);border-radius:22px;padding:clamp(22px,2.4vw,30px);box-shadow:0 30px 80px rgba(0,0,0,.6)">
        <sc-if value="{{ quizActive }}" hint-placeholder-val="{{ true }}">
          <div>
            <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px">
              <span style="flex:none;width:34px;height:34px;border-radius:9px;background:linear-gradient(0deg,var(--org1),var(--org2));display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M13 3L4 14h6l-1 7 9-11h-6z"/></svg></span>
              <h3 style="font-size:19px;font-weight:800;line-height:1.15;margin:0;text-transform:uppercase">Узнайте мощность и цену за 40 сек</h3>
            </div>
            <div style="color:var(--mut);font-size:13px;margin-bottom:18px">3 вопроса. Цена — сразу на экране, без звонков и спама.</div>

            <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--mut);margin-bottom:8px">
              <span style="font-weight:600;color:#ffb066">{{ stepLabel }}</span>
              <span>{{ progressWidth }}</span>
            </div>
            <div style="height:6px;background:#26262e;border-radius:6px;overflow:hidden;margin-bottom:22px">
              <div style="height:100%;background:linear-gradient(90deg,var(--org1),var(--org2));border-radius:6px;transition:width .45s cubic-bezier(.4,0,.2,1);width: {{ progressWidth }}"></div>
            </div>

            <sc-if value="{{ isQuestion }}" hint-placeholder-val="{{ true }}">
              <div>
                <div style="font-size:16px;font-weight:700;margin-bottom:14px">{{ questionText }}</div>
                <div style="display:grid;gap:10px">
                  <sc-for list="{{ opts }}" as="opt" hint-placeholder-count="4">
                    <button onClick="{{ opt.onClick }}" style="text-align:left;width:100%;background:#0e0e13;border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:#fff;font-size:14.5px;font-weight:500;cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:border-color .15s,background .15s,transform .1s" style-hover="border-color:var(--org1);background:#1a1a21;transform:translateX(3px)">{{ opt.label }}<span style="color:var(--org1);flex:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span></button>
                  </sc-for>
                </div>
              </div>
            </sc-if>

            <sc-if value="{{ isContact }}" hint-placeholder-val="{{ false }}">
              <div>
                <div style="background:rgba(255,90,0,.09);border:1px solid rgba(255,132,32,.35);border-radius:14px;padding:16px;margin-bottom:18px">
                  <div style="display:flex;align-items:center;gap:7px;font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em"><svg viewBox="0 0 24 24" fill="none" stroke="var(--org1)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:14px;height:14px"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Предварительная вилка</div>
                  <div style="font-size:26px;font-weight:900;color:#fff;margin-top:4px">{{ estimate }}</div>
                  <div style="font-size:12.5px;color:var(--mut);margin-top:4px">Точный расчёт под ваш объект пришлём в течение 15 минут.</div>
                </div>
                <div style="font-size:15px;font-weight:700;margin-bottom:10px">Куда прислать расчёт?</div>
                <input value="{{ phone }}" onInput="{{ onPhone }}" placeholder="+7 (___) ___-__-__" inputmode="tel" style="width:100%;background:#0e0e13;border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:#fff;font-size:15px;font-family:inherit;margin-bottom:10px" style-focus="border-color:var(--org1);outline:none">
                <div style="display:flex;gap:8px;margin-bottom:16px">
                  <sc-for list="{{ channelOpts }}" as="ch" hint-placeholder-count="3">
                    <button onClick="{{ ch.onClick }}" style="flex:1;padding:11px 8px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;border:1px solid {{ ch.border }};background:{{ ch.bg }};color:{{ ch.color }}">{{ ch.label }}</button>
                  </sc-for>
                </div>
                <button onClick="{{ onSubmit }}" style="width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(0deg,var(--org1),var(--org2));color:#fff;font-weight:800;font-size:16px;padding:16px;border:none;border-radius:12px;cursor:pointer;font-family:inherit;box-shadow:0 12px 30px rgba(255,90,0,.4);transition:transform .15s,box-shadow .15s" style-hover="transform:translateY(-2px);box-shadow:0 16px 40px rgba(255,90,0,.55)">Узнать цену аренды<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
                <div style="color:var(--mut);font-size:11px;margin-top:10px;text-align:center">Нажимая кнопку, вы соглашаетесь с политикой конфиденциальности</div>
                <sc-if value="{{ showBack }}" hint-placeholder-val="{{ true }}">
                  <button onClick="{{ onBack }}" style="width:100%;margin-top:8px;background:none;border:none;color:var(--mut);font-size:13px;cursor:pointer;font-family:inherit">← назад</button>
                </sc-if>
              </div>
            </sc-if>

            <div style="display:grid;gap:8px;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)">
              <div style="display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:#cfcfd6"><svg viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex:none;margin-top:1px"><path d="M4 12.5l5 5L20 6"/></svg> Сервисное обслуживание уже включено в стоимость</div>
              <div style="display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:#cfcfd6"><svg viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex:none;margin-top:1px"><path d="M4 12.5l5 5L20 6"/></svg> Прайс-лист на аренду ДГУ по спеццене вместе с расчётом</div>
            </div>
          </div>
        </sc-if>

                <div style="font-size:15px;font-weight:700;margin-bottom:10px">Куда прислать расчёт?</div>
                <input value="{{ phone }}" onInput="{{ onPhone }}" placeholder="+7 (___) ___-__-__" inputmode="tel" style="width:100%;background:#0e0e13;border:1px solid var(--line);border-radius:12px;padding:14px 16px;color:#fff;font-size:15px;font-family:inherit;margin-bottom:10px" style-focus="border-color:var(--org1);outline:none">
                <div style="display:flex;gap:8px;margin-bottom:16px">
                  <sc-for list="{{ channelOpts }}" as="ch" hint-placeholder-count="3">
                    <button onClick="{{ ch.onClick }}" style="flex:1;padding:11px 8px;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;border:1px solid {{ ch.border }};background:{{ ch.bg }};color:{{ ch.color }}">{{ ch.label }}</button>
                  </sc-for>
                </div>
                <button onClick="{{ onSubmit }}" style="width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(0deg,var(--org1),var(--org2));color:#fff;font-weight:800;font-size:16px;padding:16px;border:none;border-radius:12px;cursor:pointer;font-family:inherit;box-shadow:0 12px 30px rgba(255,90,0,.4);transition:transform .15s,box-shadow .15s" style-hover="transform:translateY(-2px);box-shadow:0 16px 40px rgba(255,90,0,.55)">Узнать цену аренды<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
                <div style="color:var(--mut);font-size:11px;margin-top:10px;text-align:center">Нажимая кнопку, вы соглашаетесь с политикой конфиденциальности</div>
                <sc-if value="{{ showBack }}" hint-placeholder-val="{{ true }}">
                  <button onClick="{{ onBack }}" style="width:100%;margin-top:8px;background:none;border:none;color:var(--mut);font-size:13px;cursor:pointer;font-family:inherit">← назад</button>
                </sc-if>
              </div>
            </sc-if>
            <div style="display:grid;gap:8px;margin-top:18px;padding-top:16px;border-top:1px dashed var(--line)">
              <div style="display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:#cfcfd6"><svg viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex:none;margin-top:1px"><path d="M4 12.5l5 5L20 6"/></svg> Сервисное обслуживание уже включено в стоимость</div>
              <div style="display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:#cfcfd6"><svg viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;flex:none;margin-top:1px"><path d="M4 12.5l5 5L20 6"/></svg> Прайс-лист на аренду ДГУ по спеццене вместе с расчётом</div>
            </div>
          </div>
        </sc-if>
        <sc-if value="{{ quizDone }}" hint-placeholder-val="{{ false }}">
          <div style="text-align:center;padding:24px 8px">
            <div style="width:74px;height:74px;border-radius:50%;background:rgba(61,214,140,.12);border:1px solid rgba(61,214,140,.4);display:flex;align-items:center;justify-content:center;margin:0 auto 18px"><svg viewBox="0 0 24 24" fill="none" stroke="#3DD68C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" style="width:36px;height:36px"><path d="M4 12.5l5 5L20 6"/></svg></div>
            <h3 style="font-size:22px;font-weight:800;margin:0 0 8px">Заявка принята!</h3>
            <p style="color:var(--mut);font-size:14.5px;margin:0 0 6px">Инженер подготовит точный расчёт под ваш объект и свяжется в течение 15 минут.</p>
            <p style="color:#fff;font-size:15px;font-weight:700;margin:14px 0 4px">Ваша вилка: {{ estimate }}</p>
            <button onClick="{{ onRestart }}" style="margin-top:18px;background:none;border:1px solid var(--line);color:#fff;font-size:14px;padding:12px 22px;border-radius:10px;cursor:pointer;font-family:inherit" style-hover="border-color:var(--org1)">Пройти ещё раз</button>
          </div>
        </sc-if>
      </div>
    </div>
  </sc-if>

  <!-- FLOATING CTA -->
  <button onClick="{{ openQuiz }}" style="position:fixed;right:20px;bottom:20px;z-index:70;display:inline-flex;align-items:center;gap:9px;background:linear-gradient(0deg,var(--org1),var(--org2));color:#fff;font-weight:800;font-size:14px;padding:14px 22px;border:none;border-radius:100px;cursor:pointer;font-family:inherit;box-shadow:0 12px 32px rgba(255,90,0,.5);transition:transform .15s,box-shadow .15s" style-hover="transform:translateY(-3px) scale(1.03);box-shadow:0 18px 42px rgba(255,90,0,.65)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="width:18px;height:18px"><rect x="5" y="3" width="14" height="18" rx="2.2"/><path d="M8 7h8M8 11h8M12 11v7M16 11v7M8 15h8M8 18.5h8"/></svg>
    Рассчитать аренду
  </button>

</div>
</script>
<script>
/* ЭНЕРГОРЕСУРС — standalone runtime.
   A tiny React-free interpreter for the DC template embedded in this page.
   It renders the original template against the component state, then patches
   the live DOM in place so focus, caret and CSS animations are preserved. */
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   *  Component logic (ported verbatim from the original DC component)   *
   * ------------------------------------------------------------------ */
  class Component {
    constructor() {
      this.props = { accentFrom: '#ff8420', accentTo: '#ff5500', animations: true };
      this.state = { step: 0, answers: {}, phone: '', channel: 'Звонок', openFaq: 0, isOpen: false, calcPower: 100, calcTerm: 14, modalOpen: false };
      this.STEPS = [
        { key: 'power', q: 'Какая мощность нужна?', opts: ['Не знаю — подберите под нагрузку', '30–100 кВт', '100–200 кВт', '200–500 кВт'] },
        { key: 'object', q: 'Какой объект запитываем?', opts: ['Стройплощадка без сети', 'Производство / резерв', 'Нефтегаз, буровая', 'Мероприятие'] },
        { key: 'timing', q: 'Когда нужна подача?', opts: ['Срочно — от 2 часов', 'Завтра–послезавтра', 'В течение недели', 'Планирую заранее'] },
        { key: 'term', q: 'Срок аренды?', opts: ['До 3 дней', '1–4 недели', '1–3 месяца', 'От 3 месяцев'] },
      ];
    }

    setState(patch) {
      const next = (typeof patch === 'function') ? patch(this.state) : patch;
      this.state = Object.assign({}, this.state, next);
      scheduleRender();
    }

    selectAnswer(key, label) { this.setState(s => ({ answers: { ...s.answers, [key]: label }, step: s.step + 1 })); }
    back() { this.setState(s => ({ step: Math.max(0, s.step - 1) })); }
    restart() { this.setState({ step: 0, answers: {}, phone: '', channel: 'Звонок' }); }
    setChannel(v) { this.setState({ channel: v }); }
    onPhone(e) { this.setState({ phone: e.target.value }); }
    toggleFaq(i) { this.setState(s => ({ openFaq: s.openFaq === i ? -1 : i })); }
    submit() {
      const digits = (this.state.phone || '').replace(/\D/g, '');
      if (digits.length >= 10) this.setState(() => ({ step: this.STEPS.length + 1 }));
      else {
        const el = [...document.querySelectorAll('#quiz-modal-card input, #quiz-card input')].find(i => i.offsetParent !== null) || document.querySelector('#quiz-card input');
        if (el) { el.style.borderColor = '#ff4a4a'; el.focus(); }
      }
    }
    scrollToQuiz() {
      const e = document.getElementById('quiz-card');
      if (e) { const y = e.getBoundingClientRect().top + window.pageYOffset - 90; window.scrollTo({ top: y, behavior: 'smooth' }); }
    }
    openQuiz() { this.setState({ modalOpen: true }); }
    closeQuiz() { this.setState({ modalOpen: false }); }
    estimate() {
      const p = this.state.answers.power || '';
      if (p.includes('200–500')) return 'от 8 500 ₽ / сутки';
      if (p.includes('100–200')) return 'от 4 900 ₽ / сутки';
      return 'от 2 500 ₽ / сутки';
    }

    rateFor(kw) {
      const pts = [[30, 2500], [100, 3900], [200, 4900], [320, 6500], [500, 8500]];
      if (kw <= 30) return 2500;
      if (kw >= 500) return 8500;
      for (let i = 1; i < pts.length; i++) {
        if (kw <= pts[i][0]) { const a = pts[i - 1], b = pts[i]; return a[1] + (b[1] - a[1]) * (kw - a[0]) / (b[0] - a[0]); }
      }
      return 8500;
    }
    isWorkingNow() {
      const d = new Date();
      const msk = new Date(d.getTime() + d.getTimezoneOffset() * 60000 + 3 * 3600000);
      const day = msk.getDay(), hr = msk.getHours();
      return day >= 1 && day <= 5 && hr >= 8 && hr < 17;
    }
    componentDidMount() {
      this.setState({ isOpen: this.isWorkingNow() });
      this._openTimer = setInterval(() => this.setState({ isOpen: this.isWorkingNow() }), 60000);
      const root = document.getElementById('er-root');
      if (root && this.props) {
        if (this.props.accentFrom) root.style.setProperty('--org1', this.props.accentFrom);
        if (this.props.accentTo) root.style.setProperty('--org2', this.props.accentTo);
      }
      if (!root) return;
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
      const anim = (this.props && this.props.animations === false) ? false : !reduce;

      const bar = document.getElementById('er-progress');
      const head = document.getElementById('er-head');
      const onScroll = () => {
        const de = document.documentElement;
        const max = de.scrollHeight - de.clientHeight;
        const y = window.pageYOffset || de.scrollTop;
        if (bar) bar.style.width = (max > 0 ? (y / max) * 100 : 0) + '%';
        if (head) head.style.boxShadow = y > 8 ? '0 8px 30px rgba(0,0,0,.55)' : 'none';
      };
      window.addEventListener('scroll', onScroll, { passive: true });
      onScroll();

      if (anim && 'IntersectionObserver' in window) {
        const els = Array.from(root.querySelectorAll('[data-reveal]'));
        const idxMap = new Map();
        els.forEach(el => {
          const p = el.parentElement;
          const i = idxMap.get(p) || 0; idxMap.set(p, i + 1);
          el.style.opacity = '0';
          el.style.transform = 'translateY(28px)';
          el.style.transition = 'opacity .7s cubic-bezier(.4,0,.2,1) ' + (i * 0.07) + 's, transform .7s cubic-bezier(.4,0,.2,1) ' + (i * 0.07) + 's';
        });
        const io = new IntersectionObserver((ents) => {
          ents.forEach(e => { if (e.isIntersecting) { e.target.style.opacity = '1'; e.target.style.transform = 'none'; io.unobserve(e.target); } });
        }, { threshold: 0.12 });
        els.forEach(el => io.observe(el));
      }

      const nums = Array.from(root.querySelectorAll('[data-count]'));
      const run = (el) => {
        const to = parseFloat(el.getAttribute('data-count'));
        const dec = el.getAttribute('data-dec') === '1';
        const dur = 1300, t0 = performance.now();
        const tick = (t) => {
          const p = Math.min(1, (t - t0) / dur);
          const v = to * (1 - Math.pow(1 - p, 3));
          el.textContent = dec ? v.toFixed(1).replace('.', ',') : Math.round(v).toString();
          if (p < 1) requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);
      };
      if (nums.length && anim && 'IntersectionObserver' in window) {
        const io2 = new IntersectionObserver((ents) => { ents.forEach(e => { if (e.isIntersecting) { run(e.target); io2.unobserve(e.target); } }); }, { threshold: 0.5 });
        nums.forEach(el => io2.observe(el));
      }
    }

    renderVals() {
      const n = this.STEPS.length;
      const step = this.state.step;
      const isQuestion = step < n;
      const isContact = step === n;
      const quizDone = step > n;
      const cur = this.STEPS[step] || null;
      const opts = cur ? cur.opts.map(label => ({ label, onClick: () => this.selectAnswer(cur.key, label) })) : [];
      const progress = Math.round(Math.min(step, n) / n * 100);

      const channels = ['Звонок', 'WhatsApp', 'Telegram'].map(label => {
        const active = this.state.channel === label;
        return {
          label, onClick: () => this.setChannel(label),
          bg: active ? 'rgba(255,90,0,.14)' : '#0e0e13',
          border: active ? '#ff8420' : '#26262e',
          color: active ? '#ffb066' : '#cfcfd6',
        };
      });

      const pains = [
        { pain: 'Техника отказала на объекте', painDesc: 'Работы встали, сроки горят, подрядчик ищет замену сам.', fix: 'Подменный фонд', fixDesc: 'Заменим станцию за наш счёт. Объект не простаивает.' },
        { pain: 'Привезут «китайца» — заглохнет', painDesc: 'Неизвестный агрегат без сервисной истории.', fix: 'Cummins, KOHLER-SDMO, GMGen, Denyo', fixDesc: 'Только промышленные бренды с обслуживанием.' },
        { pain: 'Не привезли в срок', painDesc: 'Договорились на завтра — приехали через неделю.', fix: 'Подача 1–2 дня', fixDesc: 'Перезвон за 15 минут, срок фиксируем в договоре.' },
        { pain: 'Счёт вырос сверх сметы', painDesc: 'Доплаты за доставку, монтаж, выезд инженера.', fix: 'Прозрачная смета', fixDesc: 'Безнал с НДС, без залога. Что входит — в договоре.' },
        { pain: 'Обслуживай сам', painDesc: 'Топливо, ТО, ремонт — головная боль вашего прораба.', fix: 'Аренда под ключ', fixDesc: 'Доставка, подключение, запуск, сервис 24/7.' },
      ];

      const faqData = [
        { q: 'Нужен залог или предоплата за технику?', a: 'Нет. Работаем без залога. Оплата по договору, безналом с НДС, все закрывающие документы предоставляем.' },
        { q: 'Как быстро подадите генератор?', a: 'Срочно — от 2 часов, планово — 1–2 дня. Срок фиксируем в договоре: не подадим вовремя — сутки аренды бесплатно.' },
        { q: 'А если станция откажет на объекте?', a: 'Привезём замену из подменного фонда за свой счёт. Объект не простаивает — это наша зона ответственности.' },
        { q: 'Сколько реально стоит аренда?', a: 'От 2 500 ₽/сутки за 30 кВт. Точная цена зависит от мощности и срока — посчитайте на калькуляторе, расчёт под объект пришлём за 15 минут.' },
        { q: 'Доставка и монтаж входят в стоимость?', a: 'Да. Привозим своим транспортом с манипулятором, подключаем и запускаем под нагрузкой. Доплат по ходу нет.' },
        { q: 'Нужен свой оператор и обслуживание?', a: 'Нет. Сервис 24/7, ТО и выезд инженера уже включены. У нас собственные операторы — сопровождаем на каждом этапе.' },
        { q: 'Чьё топливо и какой расход?', a: 'Возможны оба варианта — с топливом или без. Точный расход посчитаем под вашу нагрузку и укажем в расчёте.' },
        { q: 'Работаете только по Самаре?', a: 'Нет. Самара и область — подача от 2 часов, отгрузка на объекты по всей России. Срок и логистику закрепим в договоре.' },
      ];
      const faqs = faqData.map((f, i) => {
        const open = this.state.openFaq === i;
        return { q: f.q, a: f.a, onToggle: () => this.toggleFaq(i), rot: open ? 'rotate(45deg)' : 'rotate(0deg)', max: open ? '260px' : '0px', border: open ? 'rgba(255,132,32,.4)' : '#26262e' };
      });

      const logoBase = ['НОВАТЭК', 'Роснефть', 'Самаранефтегаз', 'Камчатскэнерго', 'КАТойл-Дриллинг', 'Cummins', 'DOOSAN', 'Volvo'];
      const clientLogos = [...logoBase, ...logoBase];

      const reviews = [
        { initial: 'А', name: 'Андрей К.', role: 'Главный энергетик, СМР', text: 'Брали ДЭС 200 кВт на объект без сети. Привезли на следующий день, подключили сами — за два месяца ни одного простоя.' },
        { initial: 'С', name: 'Сергей М.', role: 'Снабжение, нефтесервис', text: 'Нужен был срочный резерв на буровую. Подобрали мощность по телефону, договор и счёт оформили в тот же день. Работают чётко.' },
        { initial: 'О', name: 'Ольга В.', role: 'Прораб', text: 'Цену зафиксировали в договоре, доплат сверх сметы не было. Сервис приезжал по графику — вопросов нет.' },
        { initial: 'Д', name: 'Дмитрий Т.', role: 'Главный инженер, производство', text: 'Станция в шумозащитном кожухе, шума минимум. На весь срок аренды закрепили инженера — очень удобно.' },
        { initial: 'И', name: 'Игорь П.', role: 'Руководитель участка', text: 'Отдельно отмечу подменный фонд: была неисправность — заменили станцию за свой счёт быстро, объект не встал.' },
        { initial: 'Н', name: 'Наталья С.', role: 'Отдел закупок', text: 'Всё прозрачно по документам, безнал с НДС. Для промышленных объектов рекомендую.' },
      ];

      const kw = this.state.calcPower, term = this.state.calcTerm;
      const rate = this.rateFor(kw);
      let disc = 0; if (term >= 90) disc = 0.18; else if (term >= 30) disc = 0.10; else if (term >= 14) disc = 0.05;
      const perDay = Math.round(rate * (1 - disc) / 50) * 50;
      const fmt = (x) => Math.round(x).toLocaleString('ru-RU');
      const powersText = kw < 60 ? 'освещение, бытовки, ручной инструмент' : kw < 150 ? 'сварка, компрессоры, малые станки' : kw < 300 ? 'краны, насосы, цех среднего предприятия' : 'производственная линия, ЦОД, крупный объект';

      return {
        calcPower: kw,
        calcTerm: term,
        calcPowerLabel: kw + ' кВт',
        calcTermLabel: term + ' дн.',
        calcPerDay: fmt(perDay),
        calcTotal: fmt(perDay * term),
        calcDisc: disc ? Math.round(disc * 100) + '%' : '',
        calcHasDisc: !!disc,
        calcPowersText: powersText,
        onCalcPower: (e) => this.setState({ calcPower: +e.target.value }),
        onCalcTerm: (e) => this.setState({ calcTerm: +e.target.value }),
        quizActive: !quizDone,
        quizDone,
        isQuestion,
        isContact,
        questionText: cur ? cur.q : '',
        opts,
        channelOpts: channels,
        progressWidth: progress + '%',
        stepLabel: isContact ? 'Последний шаг' : ('Шаг ' + (step + 1) + ' из ' + n),
        estimate: this.estimate(),
        phone: this.state.phone,
        onPhone: (e) => this.onPhone(e),
        onSubmit: () => this.submit(),
        onBack: () => this.back(),
        onRestart: () => this.restart(),
        showBack: isContact,
        scrollToQuiz: () => this.scrollToQuiz(),
        modalOpen: this.state.modalOpen,
        openQuiz: () => this.openQuiz(),
        closeQuiz: () => this.closeQuiz(),
        stopProp: (e) => e.stopPropagation(),
        isOpen: this.state.isOpen,
        isClosed: !this.state.isOpen,
        pains, faqs, clientLogos, reviews,
      };
    }
  }

  /* ------------------------------------------------------------------ *
   *  Template interpreter                                               *
   * ------------------------------------------------------------------ */
  const cmp = new Component();
  cmp.state.isOpen = cmp.isWorkingNow();

  const host = document.getElementById('er-app');
  const hoverCss = document.getElementById('er-hover-css');
  const tplSrc = document.getElementById('er-template').textContent;
  const tplDoc = new DOMParser().parseFromString('<body>' + tplSrc + '</body>', 'text/html');
  const tplNodes = Array.from(tplDoc.body.childNodes);

  // handler registry, rebuilt every render
  let HANDLERS = {};
  let hcount = 0;

  // dedupe generated hover/focus/active classes
  const clsCache = {};
  let clsN = 0;
  function styleStateClass(kind, css) {
    const key = kind + '|' + css;
    if (clsCache[key]) return clsCache[key];
    const c = 'erx' + (++clsN);
    clsCache[key] = c;
    const sel = kind === 'hover' ? ':hover' : kind === 'focus' ? ':focus' : ':active';
    hoverCss.appendChild(document.createTextNode('.' + c + sel + '{' + css + '}'));
    return c;
  }

  function resolve(expr, scope) {
    expr = (expr || '').trim();
    if (expr === 'true') return true;
    if (expr === 'false') return false;
    if (!expr) return '';
    const parts = expr.split('.');
    let v = scope[parts[0]];
    for (let i = 1; i < parts.length && v != null; i++) v = v[parts[i]];
    return v;
  }
  function interp(str, scope) {
    return str.replace(/\{\{([^}]*)\}\}/g, (m, e) => {
      const v = resolve(e, scope);
      return v == null ? '' : String(v);
    });
  }
  function pureBinding(str) {
    const m = /^\s*\{\{([^}]*)\}\}\s*$/.exec(str || '');
    return m ? m[1].trim() : null;
  }

  // Build a fresh detached tree from template nodes + a scope.
  function renderNodes(tnodes, scope) {
    const out = [];
    for (let i = 0; i < tnodes.length; i++) {
      const t = tnodes[i];
      if (t.nodeType === 3) { out.push(document.createTextNode(interp(t.data, scope))); continue; }
      if (t.nodeType !== 1) continue; // drop comments
      const tag = t.tagName.toLowerCase();

      if (tag === 'sc-if') {
        const cond = resolve(pureBinding(t.getAttribute('value')), scope);
        if (cond) { const kids = renderNodes(t.childNodes, scope); for (let k = 0; k < kids.length; k++) out.push(kids[k]); }
        continue;
      }
      if (tag === 'sc-for') {
        const list = resolve(pureBinding(t.getAttribute('list')), scope) || [];
        const as = t.getAttribute('as');
        for (let li = 0; li < list.length; li++) {
          const child = Object.assign({}, scope); child[as] = list[li];
          const kids = renderNodes(t.childNodes, child);
          for (let k = 0; k < kids.length; k++) out.push(kids[k]);
        }
        continue;
      }

      const el = t.cloneNode(false); // shallow clone keeps namespace + attributes
      const attrs = Array.from(el.attributes);
      for (let a = 0; a < attrs.length; a++) {
        const name = attrs[a].name;
        const val = attrs[a].value;
        if (name.indexOf('hint-placeholder') === 0) { el.removeAttribute(name); continue; }
        if (name === 'style-hover' || name === 'style-focus' || name === 'style-active') {
          el.classList.add(styleStateClass(name.slice(6), val));
          el.removeAttribute(name);
          continue;
        }
        if (name === 'onclick' || name === 'oninput' || name === 'onchange') {
          const fn = resolve(pureBinding(val), scope);
          el.removeAttribute(name);
          if (typeof fn === 'function') { const id = ++hcount; HANDLERS[id] = fn; el.setAttribute('data-' + name, String(id)); }
          continue;
        }
        if (val.indexOf('{{') >= 0) el.setAttribute(name, interp(val, scope));
      }
      const kids = renderNodes(t.childNodes, scope);
      for (let k = 0; k < kids.length; k++) el.appendChild(kids[k]);
      out.push(el);
    }
    return out;
  }

  /* ---- in-place DOM patch (keeps focus, caret & CSS animations) ---- */
  function imperativeStyle(el) {
    return el.hasAttribute('data-reveal') || el.hasAttribute('data-count') ||
      el.id === 'er-progress' || el.id === 'er-head' || el.id === 'er-root';
  }
  function patchAttrs(lc, nc) {
    const skipStyle = imperativeStyle(lc);
    const la = Array.from(lc.attributes);
    for (let i = 0; i < la.length; i++) {
      const nm = la[i].name;
      if (skipStyle && nm === 'style') continue;
      if (!nc.hasAttribute(nm)) lc.removeAttribute(nm);
    }
    const na = Array.from(nc.attributes);
    for (let i = 0; i < na.length; i++) {
      const nm = na[i].name, vv = na[i].value;
      if (skipStyle && nm === 'style') continue;
      if (lc.getAttribute(nm) !== vv) lc.setAttribute(nm, vv);
    }
    const tag = lc.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') {
      if (document.activeElement !== lc) {
        const nv = nc.getAttribute('value');
        if (nv != null && lc.value !== nv) lc.value = nv;
      }
    }
  }
  function patchNode(lc, nc) {
    if (lc.nodeType !== nc.nodeType || (lc.nodeType === 1 && lc.tagName !== nc.tagName)) { lc.replaceWith(nc); return; }
    if (lc.nodeType === 3) { if (lc.data !== nc.data) lc.data = nc.data; return; }
    if (lc.nodeType === 1) {
      patchAttrs(lc, nc);
      if (lc.hasAttribute('data-count')) return; // its text is animated imperatively
      patchChildren(lc, Array.from(nc.childNodes));
    }
  }
  function patchChildren(liveParent, newChildren) {
    const live = Array.from(liveParent.childNodes);
    const n = newChildren.length;
    for (let i = 0; i < n; i++) {
      const nc = newChildren[i];
      const lc = live[i];
      if (!lc) { liveParent.appendChild(nc); continue; }
      patchNode(lc, nc);
    }
    for (let i = live.length - 1; i >= n; i--) liveParent.removeChild(live[i]);
  }

  /* ---- render scheduling ---- */
  let scheduled = false;
  function scheduleRender() {
    if (!cmp._mounted) return;
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => { scheduled = false; doRender(); });
  }
  function doRender() {
    const vals = cmp.renderVals();
    HANDLERS = {}; hcount = 0;
    patchChildren(host, renderNodes(tplNodes, vals));
  }

  /* ---- event delegation ---- */
  host.addEventListener('click', (e) => {
    let n = e.target;
    while (n && n !== host) {
      if (n.nodeType === 1 && n.hasAttribute('data-onclick')) {
        const fn = HANDLERS[n.getAttribute('data-onclick')];
        if (fn) fn(e);
        return;
      }
      n = n.parentNode;
    }
  });
  host.addEventListener('input', (e) => {
    const n = e.target;
    if (n && n.nodeType === 1 && n.hasAttribute && n.hasAttribute('data-oninput')) {
      const fn = HANDLERS[n.getAttribute('data-oninput')];
      if (fn) fn(e);
    }
  });

  /* ---- initial mount ---- */
  const vals = cmp.renderVals();
  HANDLERS = {}; hcount = 0;
  const frag = document.createDocumentFragment();
  renderNodes(tplNodes, vals).forEach(nd => frag.appendChild(nd));
  host.appendChild(frag);
  cmp._mounted = true;
  cmp.componentDidMount();
})();

</script>
</body>
</html>
